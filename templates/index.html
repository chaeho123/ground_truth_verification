<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ground Truth Verifier</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <h2>Controls</h2>
          <button id="page-toggle" class="page-toggle-btn" title="Switch to Ground Truth Creation">⚙️</button>
        </div>
        
        <!-- Verification Page Controls -->
        <div id="verify-controls" class="page-section active">
          <div class="controls-row">
            <div class="left-col">
              <label>Range (start-end) <span id="total" class="total-count"></span></label>
              <input id="range" placeholder="1-95" />
            </div>
          </div>

          <label style="margin-top: 12px; display:block;">Page</label>
          <input id="page" type="number" placeholder="1" min="1" />

          <div class="control-row">
            <button id="prev" class="control-btn">← Prev</button>
            <button id="next" class="control-btn">Next →</button>
            <button id="refresh" class="control-btn">Refresh</button>
          </div>

          <div id="status" class="status"></div>
          <div id="logs" class="logs"></div>
          <button id="delete-denied" class="control-btn" style="margin-top: 12px; width: 100%;">Delete</button>
        </div>

        <!-- Ground Truth Creation Controls -->
        <div id="create-controls" class="page-section">
          <button id="upload-btn" class="upload-icon-btn" title="Click to upload PDF files" style="font-size: 16px; padding: 2px 6px;">📁</button>
          <input type="file" id="file-input" multiple accept=".pdf" style="display:none;" />
          
          <label style="margin-top: 16px; display:block;">Folders</label>
          <div id="pdf-list" class="pdf-list"></div>

          <label style="margin-top: 16px; display:block;">Added Instances</label>
          <div id="create-logs" class="logs" style="max-height: 200px;"></div>
          <button id="export-instances-btn" class="control-btn" style="margin-top: 8px; width: 100%; color: #000;">Export</button>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="main">
        <!-- Verification Page -->
        <div id="verify-page" class="page-section active">
          <h1 id="qnum">Question</h1>
          <div class="question-row">
            <div id="question" class="question"></div>
            <div class="question-actions">
              <button id="q-approve" class="control-btn approve">Approve</button>
              <button id="q-deny" class="control-btn deny">Deny</button>
            </div>
          </div>
          <div id="viewer" class="viewer"></div>
        </div>

        <!-- Ground Truth Creation Page -->
        <div id="create-page" class="page-section">
          <div style="display: flex; flex: 1; min-height: 0; gap: 16px;">
            <div id="pdf-viewer" class="pdf-viewer">
              <p style="color:#999; text-align:center; padding-top:50px;">Select a PDF to view</p>
            </div>
            
            <div id="ai-result-container" style="display: none; flex: 0 0 350px; flex-direction: column; background: #f9f9f9; border: 1px solid #ddd; border-radius: 4px; padding: 16px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 id="ai-result-title" style="margin: 0; font-size: 16px; color: #333;">Generated Instance</h3>
                <button id="close-ai-btn" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #666; padding: 0;" title="Close view">&times;</button>
              </div>
              <pre id="ai-json-display" style="background: #fff; padding: 12px; border: 1px solid #ccc; white-space: pre-wrap; font-size: 13px; border-radius: 4px; flex: 1; overflow-y: auto; margin: 0;"></pre>
              <div id="add-btn-container" style="display: flex; justify-content: flex-end; margin-top: 12px;">
                <button id="add-instance-btn" class="control-btn" style="background: #000; color: #fff; border: none;">Add</button>
              </div>
            </div>
          </div>
          
          <div class="pdf-nav">
            <button id="pdf-multi-select" class="pdf-nav-btn">Multi-select</button>
            <button id="pdf-prev" class="pdf-nav-btn">← Prev</button>
            <span id="pdf-page-info" class="pdf-page-info">No PDF</span>
            <button id="pdf-next" class="pdf-nav-btn">Next →</button>
            <button id="pdf-ai" class="pdf-nav-btn" style="color: #1a73e8; border-color: #1a73e8;">AI</button>
            <button id="pdf-json-view" class="pdf-nav-btn" style="margin-left: auto; color: #000; border-color: #000;">JSON</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
