<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ground Truth Verifier</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.349/pdf.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h2>Controls</h2>
        <label>Range (start-end) <span id="total" class="total-count"></span></label>
        <input id="range" placeholder="1-10" />
        <div class="buttons">
          <button id="start">Start</button>
          <button id="pause">Pause</button>
          <button id="refresh">Refresh</button>
        </div>
        <div class="nav">
          <button id="prev">Prev</button>
          <button id="next">Next</button>
        </div>
        <div class="actions">
          <button id="approve" class="approve">Approve</button>
          <button id="deny" class="deny">Deny</button>
        </div>
        <div id="status" class="status"></div>
        <div id="logs" class="logs"></div>
      </div>

      <div class="main">
        <h1 id="qnum">Question</h1>
        <div id="question" class="question"></div>
        <div id="viewer" class="viewer"></div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
